name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *" # Atualiza a galáxia a cada 24h
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: Austinmff
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#D6FF00&color_dots=#0B0C10,#00FFC6,#D6FF00,#FF0054
      - uses: crazy-max/githubaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
